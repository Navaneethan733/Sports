<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | STACKLY — Page Not Found</title>
  <meta name="description" content="The page you're looking for doesn't exist. Get back to pushing limits with STACKLY.">

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="Assets/stackly-logo-clean.webp">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       STACKLY — 404 PAGE STYLES
       ========================================================================== */

    :root {
      --bg-dark: #0a0b0d;
      --bg-card: #131417;
      --bg-card-surface: #18191d;
      --volt: #d2fd04;
      --volt-hover: #bce402;
      --volt-glow: rgba(210, 253, 4, 0.28);
      --volt-dim: rgba(210, 253, 4, 0.12);

      --text-white: #ffffff;
      --text-muted: #8e95a2;
      --text-dim: #5c626e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.15);

      --font-heading: 'Barlow Condensed', 'Oswald', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-spring: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* --- Layout Containers --- */
    .container {
      width: 100%;
      max-width: 1260px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    @media (max-width: 640px) {
      .container {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    /* --- Buttons --- */
    .btn-volt {
      background: var(--volt);
      color: #000000;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .btn-volt:hover {
      background: var(--volt-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -4px var(--volt-glow);
    }

    .btn-volt:active {
      transform: translateY(0);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      padding: 14px 30px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .btn-outline:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       HEADER (simplified, consistent with main site)
       ========================================================================== */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 16px 0;
      transition: background-color 0.3s ease, padding 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
      background-color: rgba(10, 11, 13, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity var(--transition-fast);
    }

    .nav-brand:hover {
      opacity: 0.85;
    }

    .brand-logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 500;
      color: #c9ccd4;
      position: relative;
      padding: 6px 0;
      transition: color var(--transition-fast);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-white);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background-color: var(--volt);
      transition: width var(--transition-fast);
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-bag {
      background: rgba(22, 23, 27, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-bag:hover {
      border-color: var(--volt);
      background: rgba(30, 32, 38, 0.95);
      transform: translateY(-1px);
    }

    .bag-badge {
      background: var(--volt);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }

    @media (max-width: 840px) {
      .nav-links { display: none; }
    }

    /* ==========================================================================
       404 MAIN SECTION
       ========================================================================== */
    .error-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 80px 0 90px;
      background-color: #0d0e10;
      background-image:
        radial-gradient(circle at 72% 45%, rgba(95, 120, 40, 0.35) 0%, rgba(65, 85, 30, 0.18) 34%, rgba(30, 36, 22, 0.06) 58%, #0d0e10 78%),
        linear-gradient(180deg, #0d0e10 0%, #0a0b0d 100%);
    }

    /* Subtle grid texture */
    .error-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 72%);
      pointer-events: none;
    }

    .error-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .error-tag {
      color: var(--volt);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      background: var(--volt-dim);
      border: 1px solid rgba(210, 253, 4, 0.22);
    }

    .error-tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--volt);
      box-shadow: 0 0 10px var(--volt-glow);
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    /* Giant 404 numeral */
    .error-code-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      width: 100%;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(140px, 26vw, 310px);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(180deg, #ffffff 0%, #d9dde6 38%, #6f7686 78%, #3a3f4a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      user-select: none;
      position: relative;
      z-index: 2;
      animation: codeFloat 7s ease-in-out infinite alternate;
    }

    @keyframes codeFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    /* Volt accent on the "0" */
    .error-code .code-accent {
      color: transparent;
      background: linear-gradient(180deg, var(--volt) 0%, #a8cc00 55%, #6b8200 100%);
      -webkit-background-clip: text;
      background-clip: text;
      position: relative;
      display: inline-block;
    }

    /* Ghost background word behind 404 */
    .error-ghost-word {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-heading);
      font-size: clamp(120px, 20vw, 240px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.018);
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(30px, 4.4vw, 52px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.02;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .error-title .text-volt {
      color: var(--volt);
    }

    .error-desc {
      font-size: 15px;
      line-height: 1.7;
      color: #9da4b2;
      max-width: 540px;
      font-weight: 500;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 56px;
      position: relative;
      z-index: 2;
    }

    /* Quick links row */
    .error-quick-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 32px;
      border-top: 1px solid var(--border-subtle);
      max-width: 680px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .quick-link-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 6px;
      white-space: nowrap;
    }

    .quick-link {
      font-size: 13px;
      font-weight: 600;
      color: #c9ccd4;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.025);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .quick-link:hover {
      color: #000;
      background: var(--volt);
      border-color: var(--volt);
      transform: translateY(-2px);
    }

    .quick-link svg {
      width: 12px;
      height: 12px;
    }

    /* Decorative athletic visual */
    .error-visual {
      position: absolute;
      bottom: 0;
      right: -4%;
      width: 44%;
      max-width: 620px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.14;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .error-visual img {
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: right bottom;
      filter: grayscale(30%) brightness(1.1);
      mask-image: linear-gradient(to top, transparent 0%, black 55%);
      -webkit-mask-image: linear-gradient(to top, transparent 0%, black 55%);
    }

    @media (max-width: 900px) {
      .error-visual {
        width: 70%;
        right: -12%;
        opacity: 0.08;
      }
    }

    @media (max-width: 600px) {
      .error-section {
        padding: 60px 0 70px;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }
      .error-actions .btn-volt,
      .error-actions .btn-outline {
        width: 100%;
      }
      .error-quick-links {
        gap: 8px;
      }
      .quick-link-label {
        width: 100%;
        text-align: center;
        margin-right: 0;
        margin-bottom: 4px;
      }
    }

    /* ==========================================================================
       FOOTER (compact, consistent with main site)
       ========================================================================== */
    .site-footer {
      background: #151618;
      padding-top: 44px;
      padding-bottom: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
    }

    .footer-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #6c7380;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-bottom-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-white);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .footer-brand-mini img {
      height: 20px;
      width: auto;
    }

    .footer-social-mini {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-social-mini a {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .footer-social-mini a svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .footer-social-mini a:hover {
      background: var(--volt);
      border-color: var(--volt);
      color: #000;
      transform: translateY(-2px);
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }
    .delay-4 { transition-delay: 0.4s; }
  
    /* --- Mobile Toggle & Drawer Styles --- */
    .mobile-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 38px; height: 38px;
      border-radius: var(--radius-sm, 6px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      cursor: pointer;
      z-index: 1001;
      transition: background var(--transition-fast, 0.2s), border-color var(--transition-fast, 0.2s);
    }
    .mobile-toggle:hover { border-color: var(--volt, #d2fd04); }
    .mobile-toggle span {
      display: block;
      width: 18px; height: 2px;
      background-color: var(--text-white, #ffffff);
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    .mobile-toggle.active span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .mobile-toggle.active span:nth-child(2) { opacity: 0; }
    .mobile-toggle.active span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .mobile-drawer {
      position: fixed;
      top: 0; right: -100%;
      width: 85%; max-width: 360px;
      height: 100vh;
      background: #111215;
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.85);
      border-left: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      z-index: 1001;
      padding: 24px 24px 36px;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    .mobile-drawer.open { right: 0; }

    .mobile-drawer-backdrop {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .mobile-drawer-backdrop.active { opacity: 1; pointer-events: auto; }

    .mobile-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mobile-close-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast, 0.2s);
      flex-shrink: 0;
    }
    .mobile-close-btn:hover {
      border-color: var(--volt, #d2fd04);
      background: var(--volt, #d2fd04);
      color: #000;
      transform: rotate(90deg);
    }
    .mobile-close-btn svg {
      width: 18px;
      height: 18px;
    }

    .mobile-nav-links {
      list-style: none;
      display: flex; flex-direction: column; gap: 20px;
      margin: 0; padding: 0;
    }
    .mobile-nav-links .nav-link {
      font-size: 20px;
      font-family: var(--font-heading, inherit);
      letter-spacing: 0.04em;
      display: inline-block;
      text-decoration: none;
      color: #c9ccd4;
      transition: color 0.2s ease;
    }
    .mobile-nav-links .nav-link:hover,
    .mobile-nav-links .nav-link.active {
      color: var(--text-white, #ffffff);
    }

    @media (max-width: 840px) {
      .nav-links { display: none !important; }
      .mobile-toggle { display: flex !important; }
    }
    @media (max-width: 480px) {
      /* .nav-icon-btn:first-child preserved */
    }

  
    a.nav-icon-btn { text-decoration: none; color: #c9ccd4; }
    a.nav-icon-btn:hover { color: var(--volt, #d2fd04); }
  </style>
</head>
<body>

  <!-- ==========================================================================
       404 MAIN CONTENT
       ========================================================================== -->
  <main class="error-section">
    <div class="container error-inner">

      <span class="error-tag reveal delay-1">
        <span class="error-tag-dot"></span>
        Error 404 · Route Not Found
      </span>

      <div class="error-code-wrap reveal delay-2">
        <span class="error-ghost-word" aria-hidden="true">STACKLY</span>
        <h1 class="error-code">
          4<span class="code-accent">0</span>4
        </h1>
      </div>

      <h2 class="error-title reveal delay-2">
        THIS REP <span class="text-volt">MISSED</span> THE RACK
      </h2>

      <p class="error-desc reveal delay-3">
        The page you're looking for doesn't exist, was moved, or never made the cut.
        Don't drop the set — get back to the gear that pushes limits.
      </p>

      <div class="error-actions reveal delay-3">
        <a href="index.html" class="btn-volt">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Go to Home Page
        </a>
        <button onclick="window.history.back()" class="btn-outline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go back
        </button>
      </div>

    </div>

    <!-- Decorative athlete silhouette (reuses hero asset, low opacity) -->
    <div class="error-visual" aria-hidden="true">
      <img src="Assets/Dynamic Battle Rope Workout 1.webp" alt="">
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Scroll reveal
      const revealElements = document.querySelectorAll('.reveal');
      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
      );
      revealElements.forEach(el => revealObserver.observe(el));

      // Parallax on the 404 numeral for subtle depth
      const code = document.querySelector('.error-code');
      const ghost = document.querySelector('.error-ghost-word');
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        if (code && y < 700) {
          code.style.transform = `translateY(${y * -0.035}px)`;
        }
        if (ghost && y < 700) {
          ghost.style.transform = `translate(-50%, calc(-50% + ${y * 0.05}px))`;
        }
      }, { passive: true });
    });
  </script>


  <script>
    // Global Cart Badge Sync
    (function() {
      function syncBadge() {
        try {
          const raw = localStorage.getItem('stackly_cart_v1');
          if (raw) {
            const cart = JSON.parse(raw);
            const total = cart.reduce((s, it) => s + (it.qty || 1), 0);
            document.querySelectorAll('.nav-badge, #navBadge, #drawerBadge').forEach(b => {
              b.textContent = total;
            });
          }
        } catch(e) {}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncBadge);
      } else {
        syncBadge();
      }
    })();
  </script>

</body>
